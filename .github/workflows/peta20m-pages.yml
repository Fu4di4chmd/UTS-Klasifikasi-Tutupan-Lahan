name: Deploy Peta Jawa Timur 20m

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "static/peta20m/**"
      - ".github/workflows/peta20m-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload peta 20m
        uses: actions/upload-pages-artifact@v4
        with:
          path: static/peta20m

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
